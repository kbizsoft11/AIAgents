<header class="app-topbar" aria-label="Main navigation">
  <div class="topbar-left-group">
    <a class="brand-wrap" id="brandHome" href="dashboard.html" aria-label="Go to dashboard">
      <div class="brand-name">ColixAI</div>
    </a>

    <nav class="topbar-nav" aria-label="Primary navigation">
      <a href="docs.html" class="topbar-link" data-header-route="docs">Docs</a>
      <a href="workspace/workspace.html" class="topbar-link" data-header-route="workspace">Workspace</a>
      <!-- <a href="#" class="topbar-link">Community</a> -->
      <a href="marketplace.html" class="topbar-link" data-header-route="marketplace">Marketplace</a>
    </nav>
  </div>

  <div class="topbar-right-group">
    <button class="topbar-premium-btn" type="button" data-membership-section>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2l2.4 6.3L20 9.5l-5 4.3 1.8 6.2L12 0.5 7.2 20l1.8-6.2-5-4.3 5.6-1.2L12 2z"></path>
      </svg>
      Pro
    </button>

    <div class="topbar-search" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20L16.65 16.65"></path>
      </svg>
      <span>Search...</span>
      <kbd>Ctrl+/</kbd>
    </div>

    <div class="topbar-icon-group" aria-label="Quick actions">
      <button class="topbar-icon-btn" type="button" aria-label="Menu layout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h7V4H4v3zm9 0h7V4h-7v3zm-9 7h7v-3H4v3zm9 0h7v-3h-7v3zM4 18h7v-3H4v3zm9 0h7v-3h-7v3z"></path>
        </svg>
      </button>
      <button class="topbar-icon-btn" type="button" aria-label="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 01-3.46 0"></path>
        </svg>
        <span class="notification-dot"></span>
      </button>

      <div class="profile-dropdown-wrapper">
        <button class="topbar-icon-btn profile-btn" id="headerProfileBtn" type="button" aria-label="Profile"
          aria-expanded="false" aria-haspopup="true">
          <img class="profile-avatar-img" id="profileAvatar" alt="" style="display:none;">
          <svg id="profileAvatarFallback" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c1.5-3 4.5-4.5 8-4.5s6.5 1.5 8 4.5"></path>
          </svg>
        </button>

        <div class="header-profile-dropdown" id="headerProfileDropdown" role="menu" aria-label="Profile menu">
          <div class="profile-dropdown-header">
            <img class="profile-dropdown-avatar-img" id="profileAvatarLarge" alt="" style="display:none;">
            <svg id="profileAvatarLargeFallback" class="profile-dropdown-avatar-fallback" width="20" height="20"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c1.5-3 4.5-4.5 8-4.5s6.5 1.5 8 4.5"></path>
            </svg>
            <div class="profile-dropdown-identity">
              <span class="profile-dropdown-name" id="previewFullName">Not available</span>
              <span class="profile-dropdown-email" id="previewEmail">Not available</span>
            </div>
          </div>

          <div class="profile-dropdown-divider"></div>

          <a class="profile-menu-item" href="profile.html" role="menuitem">
            <span class="profile-menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 20c1.5-3 4.5-4.5 8-4.5s6.5 1.5 8 4.5"></path>
              </svg>
            </span>
            <span>Profile</span>
          </a>

          <button class="profile-menu-item" type="button" role="menuitem">
            <span class="profile-menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M3 18h18"></path>
                <path d="M7 15V9"></path>
                <path d="M12 15V5"></path>
                <path d="M17 15v-7"></path>
              </svg>
            </span>
            <span>Usage</span>
          </button>

          <button class="profile-menu-item" type="button" role="menuitem">
            <span class="profile-menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
              </svg>
            </span>
            <span>Trash</span>
          </button>

          <div class="profile-dropdown-divider"></div>

          <button class="profile-menu-item danger" type="button" role="menuitem">
            <span class="profile-menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H6a2 2 0 01-2-2V5a2 2 0 012-2h3"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path>
              </svg>
            </span>
            <span>Sign out</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
