<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <script src="blocked.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-nav-bg: #1dac4b;
        }

        body {
            min-height: 100vh;
            display: block;
            background: #f8fafc;
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 0;
        }

        .app-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 20px 12px 18px;
            background: var(--brand-nav-bg);
            color: #fff;
            box-shadow: 0 2px 12px rgba(18, 111, 51, 0.2);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-left-group,
        .topbar-right-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .brand-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.06em;
            color: #fff;
            line-height: 1;
        }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 10px;
        }

        .topbar-link {
            color: rgba(255,255,255,0.88);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .topbar-premium-btn,
        .topbar-icon-btn {
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .topbar-premium-btn {
            padding: 8px 12px;
        }

        .topbar-search {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 220px;
            border-radius: 10px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.22);
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }

        .topbar-search kbd {
            border-radius: 5px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 2px 6px;
            font-size: 11px;
        }

        .topbar-icon-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar-icon-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-btn {
            border-radius: 50%;
        }

        .page-card-wrap {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.05),
                0 4px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid #e5e7eb;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #fef2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
            font-size: 15px;
        }

        .badge {
            display: inline-block;
            margin-top: 24px;
            padding: 8px 16px;
            border-radius: 999px;
            background: #fee2e2;
            color: #dc2626;
            font-size: 13px;
            font-weight: 600;
        }

        .brand {
            margin-top: 30px;
            color: #9ca3af;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header class="app-topbar" aria-label="Main navigation">
        <div class="topbar-left-group">
            <div class="brand-wrap">
                <div class="brand-badge">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
                <div class="brand-name">ColixAI</div>
            </div>

            <nav class="topbar-nav" aria-label="Primary navigation">
                <a href="#" class="topbar-link">Docs</a>
                <a href="#" class="topbar-link">Community</a>
                <a href="#" class="topbar-link">Marketplace</a>
            </nav>
        </div>

        <div class="topbar-right-group">
            <button class="topbar-premium-btn" type="button">Pro</button>
            <div class="topbar-search" role="search">
                <span>Search...</span>
                <kbd>Ctrl+/</kbd>
            </div>
            <div class="topbar-icon-group" aria-label="Quick actions">
                <button class="topbar-icon-btn" type="button" aria-label="Notifications">🔔</button>
                <button class="topbar-icon-btn profile-btn" type="button" aria-label="Profile">👤</button>
            </div>
        </div>
    </header>

    <div class="page-card-wrap">
        <div class="card">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
            </div>

            <h1>Account Disabled</h1>

            <p>
                Your account is currently not authorized to use this extension.
                Please contact your administrator if you believe this is an error.
            </p>

            <div class="badge">
                Access Restricted
            </div>

            <div class="brand">
                ColixAI Extension
            </div>
        </div>
    </div>

</body>

</html>
